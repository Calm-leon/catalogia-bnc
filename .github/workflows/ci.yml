name: CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  backend:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.6.3

      - name: Lint backend
        run: ruff check backend/app backend/tests

      - name: Run backend tests
        run: |
          cd backend
          pytest

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  migrations:
    name: Validate SQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalogia
          POSTGRES_PASSWORD: catalogia
          POSTGRES_DB: catalogia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalogia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: catalogia
        run: |
          for file in db/migrations/*.sql; do
            echo "Applying $file"
            psql -h localhost -U catalogia -d catalogia -v ON_ERROR_STOP=1 -f "$file"
          done

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config
