services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_PATH: ${STORAGE_PATH}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      AI_ENGINE_PROVIDER: ${AI_ENGINE_PROVIDER}
      AI_ENGINE_TIMEOUT_SECONDS: ${AI_ENGINE_TIMEOUT_SECONDS}
      AI_ENGINE_MAX_RETRIES: ${AI_ENGINE_MAX_RETRIES}
      AI_ENGINE_FALLBACK_TO_MOCK: ${AI_ENGINE_FALLBACK_TO_MOCK}
      APP_ENV: ${APP_ENV}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      LOCAL_AI_ENGINE_URL: ${LOCAL_AI_ENGINE_URL}
      LOCAL_AI_ENGINE_MODEL: ${LOCAL_AI_ENGINE_MODEL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CATALOGER_TOKEN: ${CATALOGER_TOKEN}
      VIEWER_TOKEN: ${VIEWER_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/data

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
